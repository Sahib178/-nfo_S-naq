    <style>
      :root {
        --bg: #050b2e;
        --card-bg: rgba(11, 20, 72, 0.95);
        --line: #4258b5;
        --gold: #ffd166;
        --gold-glow: rgba(255, 209, 102, 0.35);
        --text: #f5f7ff;
        --muted: #a4b3f0;
        --green: #20bf6b;
        --red: #eb3b5a;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(
          circle at top,
          #142878 0%,
          #060c33 60%,
          #020517 100%
        );
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .wrap {
        width: 100%;
        max-width: 820px;
        margin: auto;
        padding: 16px;
      }
      .card {
        background: var(--card-bg);
        border: 1.5px solid var(--line);
        border-radius: 24px;
        padding: clamp(16px, 4vw, 32px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(12px);
      }
      .center {
        text-align: center;
      }
      .logo {
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 3px solid var(--gold);
        display: grid;
        place-items: center;
        margin: 0 auto 14px;
        font-size: 32px;
        font-weight: 900;
        color: var(--gold);
        background: #15246a;
        box-shadow: 0 0 25px var(--gold-glow);
      }
      h1 {
        font-size: clamp(24px, 5.5vw, 36px);
        margin: 0 0 8px;
        line-height: 1.2;
      }
      h1 span {
        color: var(--gold);
      }
      .muted {
        color: var(--muted);
      }
      .badges {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 14px 0 20px;
      }
      .badge {
        border: 1px solid var(--line);
        background: #08113c;
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 13px;
      }
      .badge b {
        color: var(--gold);
      }

      /* Sinif Grid */
      .classgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
        gap: 10px;
        margin: 16px 0 22px;
      }
      .classbtn {
        min-height: 58px;
        background: #0c184c;
        border: 1.5px solid var(--line);
        border-radius: 14px;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .classbtn:active {
        transform: scale(0.95);
      }
      .classbtn.active {
        background: linear-gradient(180deg, #ffe082, #ffb300);
        color: #140d00;
        border-color: #ffe082;
        box-shadow: 0 0 20px var(--gold-glow);
      }

      label {
        display: block;
        text-align: left;
        color: var(--muted);
        margin: 0 0 6px 4px;
        font-size: 14px;
      }
      input,
      select {
        width: 100%;
        padding: 13px 15px;
        border-radius: 12px;
        border: 1.5px solid var(--line);
        background: #060e36;
        color: #fff;
        font-size: 16px;
        margin-bottom: 14px;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 10px var(--gold-glow);
      }
      .row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1 1 180px;
      }

      .btn {
        width: 100%;
        border: 0;
        border-radius: 14px;
        padding: 15px 20px;
        font-weight: 800;
        font-size: 16px;
        cursor: pointer;
        transition:
          transform 0.1s,
          filter 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
      }
      .btn:active {
        transform: scale(0.98);
      }
      .primary {
        background: linear-gradient(180deg, #ffe082, #ffb300);
        color: #1a1200;
      }
      .secondary {
        background: #101c54;
        border: 1.5px solid var(--line);
        color: var(--text);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Test Ekranı */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .pill {
        background: #091340;
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 700;
      }
      .timer {
        color: var(--gold);
      }
      .progress {
        height: 6px;
        background: #101c54;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 18px;
      }
      .progress-bar {
        height: 100%;
        background: var(--gold);
        transition: width 0.25s ease;
      }

      .question-box {
        background: linear-gradient(180deg, #112061, #0a1443);
        border: 1.5px solid #3d56b8;
        border-radius: 18px;
        padding: 20px 16px;
        min-height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: clamp(17px, 3.8vw, 22px);
        font-weight: 700;
        line-height: 1.45;
        margin-bottom: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }
      .answers-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }
      @media (min-width: 600px) {
        .answers-grid {
          grid-template-columns: 1fr 1fr;
        }
      }
      .ans-btn {
        background: linear-gradient(180deg, #12205e, #0a1441);
        border: 1.5px solid var(--line);
        color: #fff;
        border-radius: 16px;
        padding: 14px 16px;
        font-size: 15px;
        font-weight: 600;
        text-align: left;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        transition: all 0.15s ease;
        min-height: 62px;
      }
      .ans-btn:active {
        transform: scale(0.98);
      }
      .ans-btn .letter {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1d2d78;
        border: 1px solid var(--gold);
        color: var(--gold);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex-shrink: 0;
      }
      .ans-btn.selected {
        background: linear-gradient(180deg, #ffe082, #ffb300);
        color: #140d00;
        border-color: #fff;
        font-weight: 700;
      }
      .ans-btn.selected .letter {
        background: #140d00;
        color: #ffe082;
        border-color: #140d00;
      }

      .review-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
        gap: 6px;
        margin: 16px 0;
      }
      .rev-tag {
        padding: 8px 0;
        border-radius: 8px;
        font-weight: 800;
        font-size: 13px;
        text-align: center;
      }
      .c-true {
        background: var(--green);
        color: #fff;
      }
      .c-false {
        background: var(--red);
        color: #fff;
      }
      .c-empty {
        background: #1a2559;
        color: var(--muted);
      }

      .code-box {
        background: #02061f;
        border: 1.5px dashed var(--gold);
        border-radius: 12px;
        padding: 12px;
        font-family: monospace;
        font-size: 14px;
        word-break: break-all;
        margin: 14px 0;
        color: #ffe082;
      }
      footer {
        text-align: center;
        padding: 14px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>

      let grade = 0,

        shuffledOptions = [],
        answers = [],
        currentIndex = 0,
        startAt = 0,
        timerId = null,
        isFinished = false,

      // Köməkçi funksiyalar
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function shuffle(arr) {
        let a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          let j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function fmtTime(sec) {
        sec = Math.max(0, Math.round(sec));
        return (
          String(Math.floor(sec / 60)).padStart(2, "0") +
          ":" +
          String(sec % 60).padStart(2, "0")
        );
      }

      function vibrate(ms = 35) {
        if (navigator.vibrate) navigator.vibrate(ms);
      }

      /* 1. ƏSAS GİRİŞ EKRANI */
      function renderHome() {
        stopTimer();
        isFinished = false;
        grade = 0;

        app.innerHTML = `
    <section class="card center">
      <div class="logo">İF</div>
      <h1>İnformatika <span>Milyonçusu</span></h1>
      <p class="muted">Hər dəfə yeni və təsadüfi suallarla mobil sınaq</p>

      <div class="badges">
        <div class="badge"><b>25</b> təsadüfi sual</div>
        <div class="badge"><b>1-11-ci</b> siniflər</div>
        <div class="badge"><b>Offline</b> dəstəyi</div>
      </div>

      <label>Sinifinizi seçin:</label>
      <div class="classgrid">
        ${Array.from({ length: 11 }, (_, i) => `<button class="classbtn" data-grade="${i + 1}">${i + 1}</button>`).join("")}
      </div>

      <div class="row">
        <div>
          <label for="student">Ad və Soyadınız</label>
          <input id="student" maxlength="50" placeholder="Məsələn: Tural Fərəcov">
        </div>
        <div>
          <label for="time">Müddət</label>
          <select id="time">
            <option value="45">45 dəqiqə</option>
            <option value="30">30 dəqiqə</option>
            <option value="20">20 dəqiqə</option>
            <option value="10">10 dəqiqə</option>
          </select>
        </div>
      </div>

      <button id="start" class="btn primary" disabled>🚀 Sınağa Başla</button>
      <button id="installPwa" class="btn secondary" style="margin-top:10px; display:none;">📲 Tətbiqi Telefona Quraşdır</button>
    </section>
  `;

        // Sinif seçimi eventləri
        document.querySelectorAll("[data-grade]").forEach((b) => {
          b.onclick = () => {
            vibrate(20);
            grade = +b.dataset.grade;
            document
              .querySelectorAll("[data-grade]")
              .forEach((x) => x.classList.toggle("active", x === b));
            checkValid();
          };
        });

        document.getElementById("student").oninput = checkValid;
        document.getElementById("start").onclick = startQuiz;

        setupPwaInstall();
      }

      function checkValid() {
        let val = document.getElementById("student").value.trim();
        let words = val.split(/\s+/).filter(Boolean);
        document.getElementById("start").disabled = !(
          grade > 0 && words.length >= 1
        );
      }

      /* 2. SINAĞA BAŞLAMAQ (TƏSADÜFİ SUALLARIN GENERASİYASI) */
      function startQuiz() {
        vibrate(40);
        studentName = document
          .getElementById("student")
          .value.trim()
          .replace(/\s+/g, " ");
        let mins = Number(document.getElementById("time").value) || 45;
        limitSec = mins * 60;

        let pool = QUESTION_POOL[grade] || QUESTION_POOL[1];

        // Sual hovuzundan tam təsadüfi (random) TOTAL_QUESTIONS sayda seçirik
        let rawQuestions = shuffle(pool).slice(0, TOTAL_QUESTIONS);

        // Hər bir sualı formatlayırıq və variantların daxili nizamını da qarışdırırıq
        questions = rawQuestions.map((q) => {
          let originalOptions = q[1];
          let correctIndex = q[2];
          let correctText = originalOptions[correctIndex];

          let indexedOptions = originalOptions.map((text, i) => ({
            text,
            isCorrect: i === correctIndex,
          }));
          let shuffled = shuffle(indexedOptions);
          let newCorrectIndex = shuffled.findIndex((o) => o.isCorrect);

          return {
            text: q[0],
            options: shuffled.map((o) => o.text),
            correct: newCorrectIndex,
          };
        });

        answers = Array(TOTAL_QUESTIONS).fill(-1);
        currentIndex = 0;
        startAt = Date.now();
        isFinished = false;

        renderQuizScreen();
        startTimer();
      }

      function startTimer() {
        stopTimer();
        function tick() {
          let el = document.getElementById("timer");
          if (!el || isFinished) {
            stopTimer();
            return;
          }
          let remain = Math.max(0, limitSec - (Date.now() - startAt) / 1000);
          el.textContent = fmtTime(remain);
          if (remain <= 0) finishQuiz(true);
        }
        tick();
        timerId = setInterval(tick, 250);
      }

      function stopTimer() {
        if (timerId) clearInterval(timerId);
        timerId = null;
      }

      /* 3. TEST EKRANI */
      function renderQuizScreen() {
        let q = questions[currentIndex];
        let answered = answers[currentIndex] !== -1;
        let progressPct = ((currentIndex + 1) / TOTAL_QUESTIONS) * 100;

        app.innerHTML = `
    <section class="card">
      <div class="top-bar">
        <span class="pill"><b>${grade}-ci sinif</b> · ${esc(studentName)}</span>

      </div>

      <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
        <span class="muted" style="font-size:13px; font-weight:700;">SUAL ${currentIndex + 1} / ${TOTAL_QUESTIONS}</span>
        <span class="muted" style="font-size:13px;">Cavablandı: ${answers.filter((x) => x !== -1).length}</span>
      </div>

      <div class="question-box">
        ${esc(q.text)}
      </div>

      <div class="answers-grid">
        ${q.options
          .map(
            (opt, i) => `
          <button class="ans-btn ${answers[currentIndex] === i ? "selected" : ""}" data-ans="${i}" ${answered ? "disabled" : ""}>
            <span class="letter">${["A", "B", "C", "D"][i]}</span>
            <span>${esc(opt)}</span>
          </button>
        `,
          )
          .join("")}
      </div>

      <div class="row" style="margin-top: 24px;">
        <button id="finishBtn" class="btn secondary">Testi Bitir</button>
        <button id="nextBtn" class="btn primary">${currentIndex === TOTAL_QUESTIONS - 1 ? "Nəticəni Gör 🏁" : "Növbəti Sual →"}</button>
      </div>
    </section>
  `;

        document.querySelectorAll("[data-ans]").forEach((btn) => {
          btn.onclick = () => {
            if (answers[currentIndex] !== -1 || isFinished) return;
            vibrate(25);
            answers[currentIndex] = +btn.dataset.ans;
            renderQuizScreen();
          };
        });

        document.getElementById("nextBtn").onclick = () => {
          vibrate(20);
          if (currentIndex < TOTAL_QUESTIONS - 1) {
            currentIndex++;
            renderQuizScreen();
          } else {
            finishQuiz(false);
          }
        };

        document.getElementById("finishBtn").onclick = () => {
          if (confirm("Testi vaxtından əvvəl bitirmək istəyirsiniz?")) {
            finishQuiz(false);
          }
        };
      }

      /* 4. NƏTİCƏ EKRANI */
      function finishQuiz(timeout = false) {
        if (isFinished) return;
        isFinished = true;
        stopTimer();
        vibrate([50, 100, 50]);

        let correctCount = questions.reduce(
          (acc, q, i) => acc + (answers[i] === q.correct ? 1 : 0),
          0,
        );
        let pct = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
        let spent = Math.round((Date.now() - startAt) / 1000);

        let code = `INF-${grade}S-${Math.floor(Date.now() / 1000).toString(36).toUpperCase()}-${correctCount}D${TOTAL_QUESTIONS}`;
        let shareText = `İnformatika Testi (${grade}-ci sinif)\nŞagird: ${studentName}\nNəticə: ${correctCount}/${TOTAL_QUESTIONS} (${pct}%)\nVaxt: ${Math.floor(spent / 60)} dəq ${spent % 60} san\nTəsdiq kodu: ${code}`;

        app.innerHTML = `
    <section class="card center">
      <div class="logo">🏆</div>
      <h1>${pct >= 80 ? "Əla Nəticə!" : pct >= 50 ? "Yaxşı Cəhd!" : "Daha Çox Çalışmalısan!"}</h1>
      <p class="muted">${esc(studentName)} · ${grade}-ci sinif ${timeout ? "(Vaxt bitdi)" : ""}</p>

      <div style="font-size:clamp(46px, 10vw, 68px); font-weight:900; color:var(--gold); margin: 8px 0;">
        ${correctCount} <span style="font-size:0.45em; color:#fff;">/ ${TOTAL_QUESTIONS}</span>
      </div>
      <h2 style="margin:0 0 16px;">${pct}%</h2>

      <div class="row">
        <div class="pill">Düzgün: <b style="color:var(--green)">${correctCount}</b></div>
        <div class="pill">Səhv: <b style="color:var(--red)">${answers.filter((a, i) => a !== -1 && a !== questions[i].correct).length}</b></div>
        <div class="pill">Boş: <b>${answers.filter((a) => a === -1).length}</b></div>
      </div>

      <div class="review-grid">
        ${questions
          .map((q, i) => {
            let cls =
              answers[i] === -1
                ? "c-empty"
                : answers[i] === q.correct
                  ? "c-true"
                  : "c-false";
            return `<div class="rev-tag ${cls}">${i + 1}</div>`;
          })
          .join("")}
      </div>

      <div class="code-box">${code}</div>

      <div class="row" style="margin-top:16px;">
        <a class="btn" style="background:#25D366; color:#fff;" target="_blank" href="https://wa.me/?text=${encodeURIComponent(shareText)}">📲 WhatsApp ilə Paylaş</a>
        <button id="retryBtn" class="btn primary">🔄 Yenidən Sına (Yeni Suallar)</button>
      </div>

      <button id="homeBtn" class="btn secondary" style="margin-top:10px;">🏠 Əsas Menyuya Qayıt</button>

      <details style="text-align:left; margin-top:20px; font-size:14px; background:#04092b; padding:12px; border-radius:12px;">
        <summary style="cursor:pointer; font-weight:700; color:var(--gold);">Cavabların Analizi (Geniş baxış)</summary>
        <div style="margin-top:12px;">
          ${questions
            .map(
              (q, i) => `
            <div style="margin-bottom:12px; border-bottom:1px solid #1c2b6e; padding-bottom:8px;">
              <b>${i + 1}. ${esc(q.text)}</b><br>
              Sənin cavabın: <span style="color:${answers[i] === q.correct ? "var(--green)" : "var(--red)"}">
                ${answers[i] === -1 ? "Cavab verilməyib" : esc(q.options[answers[i]])}
              </span><br>
              Düzgün cavab: <b style="color:var(--gold)">${esc(q.options[q.correct])}</b>
            </div>
          `,
            )
            .join("")}
        </div>
      </details>
    </section>
  `;

        document.getElementById("retryBtn").onclick = () => {
          vibrate(30);
          startQuiz(); // Eyni şagird və sinif üçün YEPYENİ 25 sual seçir
        };
        document.getElementById("homeBtn").onclick = () => {
          vibrate(20);
          renderHome();
        };
      }

      /* 5. PWA (PROQRAMI MOBİLƏ QURAŞDIRMAQ DƏSTƏYİ) */
      let deferredPrompt;
      function setupPwaInstall() {
        window.addEventListener("beforeinstallprompt", (e) => {
          e.preventDefault();
          deferredPrompt = e;
          const btn = document.getElementById("installPwa");
          if (btn) {
            btn.style.display = "block";
            btn.onclick = async () => {
              if (deferredPrompt) {
                deferredPrompt.prompt();
                const choice = await deferredPrompt.userChoice;
                if (choice.outcome === "accepted") {
                  btn.style.display = "none";
                }
                deferredPrompt = null;
              }
            };
          }
        });
      }

      // Offline işləməsi üçün Service Worker qeydiyyatı
      if ("serviceWorker" in navigator) {
        const swBlob = new Blob(
          [
            `
      const CACHE_NAME = 'inf-v1';
      self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
      self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
      self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
    `,
          ],
          { type: "application/javascript" },
        );

        navigator.serviceWorker
          .register(URL.createObjectURL(swBlob))
          .catch(() => {});
      }

      renderHome();
    </script>
  </body>
</html>
